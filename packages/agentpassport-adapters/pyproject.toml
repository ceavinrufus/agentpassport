[project]
name = "agentpassport-adapters"
version = "0.3.4"
description = "MCP and REST adapters for agentpassport agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "mcp",
    "a2a",
    "adapters",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "agentpassport",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://agentpassport.fyi"
Documentation = "https://docs.agentpassport.fyi"
Repository = "https://github.com/ceavinrufus/agentpassport"
Issues = "https://github.com/ceavinrufus/agentpassport/issues"
Changelog = "https://github.com/ceavinrufus/agentpassport/blob/main/CHANGELOG.md"

[tool.uv.sources]
agentpassport = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpassport_adapters"]
