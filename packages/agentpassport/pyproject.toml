[project]
name = "agentpassport"
version = "0.3.4"
description = "Trust and authorization layer for multi-agent systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "authorization",
    "delegation",
    "did",
    "identity",
    "jwt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pynacl>=1.5.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://agentpassport.fyi"
Documentation = "https://docs.agentpassport.fyi"
Repository = "https://github.com/ceavinrufus/agentpassport"
Issues = "https://github.com/ceavinrufus/agentpassport/issues"
Changelog = "https://github.com/ceavinrufus/agentpassport/blob/main/CHANGELOG.md"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "starlette>=0.37", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpassport"]
