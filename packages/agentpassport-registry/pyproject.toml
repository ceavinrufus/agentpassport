[project]
name = "agentpassport-registry"
version = "0.3.4"
description = "Trusted agent registry with AgentCard signature verification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "registry",
    "agentcard",
    "authorization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "agentpassport",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.28.1",
    "slowapi>=0.1.9,<0.2",
]

[project.urls]
Homepage = "https://agentpassport.fyi"
Documentation = "https://docs.agentpassport.fyi"
Repository = "https://github.com/ceavinrufus/agentpassport"
Issues = "https://github.com/ceavinrufus/agentpassport/issues"
Changelog = "https://github.com/ceavinrufus/agentpassport/blob/main/CHANGELOG.md"

[tool.uv.sources]
agentpassport = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpassport_registry"]
