[project]
name = "agentpassport-cli"
version = "0.3.4"
description = "CLI tools for agentpassport trace viewing and key management"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "cli",
    "identity",
    "trace",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "agentpassport",
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://agentpassport.fyi"
Documentation = "https://docs.agentpassport.fyi"
Repository = "https://github.com/ceavinrufus/agentpassport"
Issues = "https://github.com/ceavinrufus/agentpassport/issues"
Changelog = "https://github.com/ceavinrufus/agentpassport/blob/main/CHANGELOG.md"

[project.scripts]
agentpass = "agentpassport_cli.main:cli"
ap = "agentpassport_cli.main:cli"

[tool.uv.sources]
agentpassport = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpassport_cli"]
